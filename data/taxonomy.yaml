# Class -> family, sibling groups, and text forms. Fixed before any results are seen (Phase 2, 2026-10-22).
# Any later change is logged with its reason in reports/decisions_log.md.
#
# Families: human_vocal, human_activity, speech_emotion, animal, nature, machine_domestic, music.
# "human_activity" is an addition to the README's list, for non-vocal human sounds (clapping, footsteps...),
# which fit neither "human vocal" nor "machine/domestic".
#
# Each class has:  family, groups (sibling groups it belongs to, may be empty), text (2-3 short natural
# descriptions; the class name itself is always embedded too).

families: [human_vocal, human_activity, speech_emotion, animal, nature, machine_domestic, music]

esc50:   # all 50 classes; official 5 folds
