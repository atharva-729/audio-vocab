cremad:   # emotion codes; actor-grouped splits; the 12 sentences are held fixed across emotions
  ANG: {family: speech_emotion, groups: [emotions], word: angry, text: ["an angry voice", "a person speaking angrily"]}
  DIS: {family: speech_emotion, groups: [emotions], word: disgusted, text: ["a disgusted voice", "a person speaking with disgust"]}
  FEA: {family: speech_emotion, groups: [emotions], word: afraid, text: ["a frightened voice", "a person speaking fearfully"]}
  HAP: {family: speech_emotion, groups: [emotions], word: happy, text: ["a happy voice", "a person speaking happily"]}
  NEU: {family: speech_emotion, groups: [emotions], word: neutral, text: ["a neutral voice", "a person speaking calmly and flatly"]}
  SAD: {family: speech_emotion, groups: [emotions], word: sad, text: ["a sad voice", "a person speaking sadly"]}

music:
  # FMA top-level genres -> genre word. Membership: the track's genres_all contains exactly one of these top-levels.
  genres:
    Classical:        classical
    Jazz:             jazz
    Folk:             folk
    Electronic:       electronic
    Rock:             rock
    Pop:              pop
    Hip-Hop:          hip-hop
    Blues:            blues
    Country:          country
    Soul-RnB:         soul
    Easy Listening:   easy listening
  # Dropped from the genre-word tests (not genre words, or not about style):
  dropped_genres:
    Instrumental: "a property, not a genre; used only as a metadata hint for the instrumental filter"
    Experimental: "a catch-all (noise, field recordings, sound art), not one musical style"
    International: "a parent of regional subgenres; used for regions instead"
    Spoken: "not music"
    Old-Time / Historic: "an era/recording-quality label, not a style"
  # FMA International subgenres -> region word. Most specific subgenre wins (Spanish beats Europe).
  regions:
    Europe:        European
    Balkan:        Balkan
    Latin America: Latin American
    French:        French
    African:       African        # includes the child Afrobeat
    Afrobeat:      African
    Brazilian:     Brazilian
    Indian:        Indian
    Middle East:   Middle Eastern
    Asia-Far East: East Asian
    Spanish:       Spanish
    Latin:         Latin
  dropped_regions:
    Reggae - Dub: "a genre (Jamaican style) rather than a region; would conflate genre and region"
    Reggae - Dancehall: "as above"
    other: "subgenres with < 20 distinct artists (Celtic, Romany, Klezmer, Polka, Turkish, Flamenco, Tango, Fado, Cumbia, Pacific...)"
  word_forms: ["{w}", "{w} music", "a piece of {w} music"]
  # MTG-Jamendo instrument-held-fixed cells (Phase 8); shards 53 and 86
  mtg_instruments: [piano, guitar, strings, synthesizer]
  mtg_genres: [classical, jazz, ambient, pop, electronic, rock, folk, soundtrack]
