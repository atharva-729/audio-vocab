  cow:              {family: animal, groups: [esc_farm], text: ["a cow mooing", "cattle lowing"]}
  frog:             {family: animal, groups: [], text: ["a frog croaking", "frogs calling at night"]}
  cat:              {family: animal, groups: [esc_pets], text: ["a cat meowing", "a cat mewing"]}
  hen:              {family: animal, groups: [esc_farm, esc_birds], text: ["a hen clucking", "chickens clucking"]}
